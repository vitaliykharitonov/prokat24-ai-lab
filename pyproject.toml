[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prokat24-ai-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "openai>=2.46,<3",
    "pydantic>=2,<3",
    "arize-phoenix-otel>=0.17,<0.18",
    "arize-phoenix-client>=3.5,<4",
    "openinference-instrumentation>=0.1,<1",
    "openinference-instrumentation-openai>=0.1.66,<0.2",
    "opentelemetry-api>=1.45,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy>=2.3,<3",
    "pandas>=3,<4",
    "matplotlib>=3,<4",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "deepeval>=4.1.5,<5",
    "ragas>=0.4.3,<0.5", # Need to update later
    "langchain-community==0.3.31",
    "opentelemetry-sdk>=1.45,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prokat24_ai_lab" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes: unused imports, undefined names
    "I", # import sorting
    "UP", # pyupgrade: modern Python syntax
    "B", # flake8-bugbear: likely bugs
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "RUF001", # Cyrillic text is expected in this project
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true