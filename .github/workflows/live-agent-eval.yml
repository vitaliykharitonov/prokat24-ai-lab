name: Live Agent Eval

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live_agent_eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Find previous successful eval run
        id: previous_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_run_id=$(gh run list \
            --workflow live-agent-eval.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"

      - name: Download previous agent eval report
        if: steps.previous_run.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.previous_run.outputs.run_id }}" \
            --name agent-eval-reports \
            --dir previous_agent_eval

      - name: Run live agent evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/evals/run_agent_outcome_baseline.py

      - name: Write agent eval summary
        run: python scripts/evals/write_agent_eval_summary.py

      - name: Write agent eval comparison
        if: steps.previous_run.outputs.run_id != ''
        run: python scripts/evals/write_agent_eval_comparison.py

      - name: Upload agent eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-eval-reports
          path: reports/agent/
          if-no-files-found: warn